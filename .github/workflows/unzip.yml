name: Unzip

# priv-esc. Drop any .zip at the TOP LEVEL of this repo (any branch, any
# filename) and this unpacks it over the working tree, then commits the result.
# The archive is deleted in the same commit so the repo does not accumulate
# payloads. Works whether the zip holds the game files at its root or wraps
# them in a single folder.
on:
  push:
    paths:
      - '*.zip'
  # Lets you re-run by hand from the Actions tab without pushing a new zip.
  workflow_dispatch:

permissions:
  contents: write

# Two unpacks on the same branch must never race each other.
concurrency:
  group: "unzip-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  unzip:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # This job's own commit deletes the zip, and `paths` above matches a deletion
    # as well as an addition, so without this guard the workflow can trigger
    # itself. GITHUB_TOKEN pushes do not start new runs by default, which is why
    # it usually "works", but that is luck: swap in a PAT and it loops.
    if: github.actor != 'github-actions[bot]'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Find the archive
        id: guard
        run: |
          set -euo pipefail
          COUNT=$(find . -maxdepth 1 -name '*.zip' -type f | wc -l)

          if [ "$COUNT" -eq 0 ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No .zip found at the repo root - nothing to unpack."
            exit 0
          fi

          if [ "$COUNT" -gt 1 ]; then
            echo "::warning::$COUNT zips at the repo root; using the first one."
            find . -maxdepth 1 -name '*.zip' -type f
          fi

          ZIP=$(find . -maxdepth 1 -name '*.zip' -type f | sort | head -1)
          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"
          echo "Archive found: $ZIP ($(du -h "$ZIP" | cut -f1))"

      - name: Unpack into a temp directory
        if: steps.guard.outputs.found == 'true'
        run: |
          set -euo pipefail

          rm -rf /tmp/payload && mkdir -p /tmp/payload

          echo "Archive: $ZIP"
          echo "Size: $(du -h "$ZIP" | cut -f1)"
          echo "Type: $(file -b "$ZIP" 2>/dev/null || echo unknown)"

          if ! unzip -l "$ZIP" > /tmp/ziplist.txt 2>/tmp/ziperr.txt; then
            echo "::error::The archive could not be read as a zip. It is corrupt, truncated or not a zip at all."
            cat /tmp/ziperr.txt
            echo "First bytes:"
            head -c 16 "$ZIP" | od -An -tx1
            exit 1
          fi
          echo "Entries in archive: $(( $(wc -l < /tmp/ziplist.txt) - 3 ))"

          # -o overwrites; the payload dir is fresh so nothing stale survives.
          # unzip exits 1 on warnings too, so success is confirmed below instead.
          unzip -q -o "$ZIP" -d /tmp/payload 2>/tmp/unziperr.txt || true

          if [ -z "$(ls -A /tmp/payload)" ]; then
            echo "::error::The archive extracted to nothing."
            cat /tmp/unziperr.txt
            exit 1
          fi

          # Find the game root rather than assuming a shape. This repo's
          # index.html sits at the top, but an export may wrap everything in a
          # folder, and the wrapper name never matters. Take the SHALLOWEST
          # index.html so a stray one deeper inside cannot win.
          SRC=$(find /tmp/payload -name index.html -type f \
                  -not -path '*/__MACOSX/*' \
                  -not -path '*/node_modules/*' \
                  -not -path '*/.git/*' \
                  -printf '%d\t%h\n' 2>/dev/null | sort -n | head -1 | cut -f2- || true)

          if [ -z "${SRC:-}" ] || [ ! -d "$SRC" ]; then
            echo "::error::No index.html found in the archive - refusing to copy anything."
            echo ""
            echo "DIAGNOSIS: the archive holds no index.html at any level."
            echo "--- COMPLETE CONTENTS (first 200 entries) ---"
            find /tmp/payload -mindepth 1 -printf '%y %p\n' 2>/dev/null | sort | head -200
            echo "--- end of listing ---"
            echo "Total files: $(find /tmp/payload -type f | wc -l)"
            exit 1
          fi

          echo "Content root: $SRC"
          echo "  html files: $(find "$SRC" -maxdepth 2 -name '*.html' | wc -l)"
          echo "  total files: $(find "$SRC" -type f | wc -l)"

          # A priv-esc zip must carry its code with it. If only index.html
          # is present, the unpack would wipe the game logic, so refuse it.
          if [ ! -f "$SRC/index.html" ]; then
            echo "::error::Missing required file: index.html"
            exit 1
          fi
          if ! find "$SRC" -name '*.js' -type f -not -path '*/__MACOSX/*' | grep -q .; then
            echo "::error::No JavaScript files found - the archive would leave the game broken."
            exit 1
          fi

          echo "SRC=$SRC" >> "$GITHUB_ENV"

      - name: Copy payload over the working tree
        if: steps.guard.outputs.found == 'true'
        run: |
          set -euo pipefail

          # tar rather than cp so dotfiles come across too. The excludes are
          # load-bearing:
          #   .git     - a stale .git extracted over the checkout corrupts the
          #              repository mid-job and the commit below fails
          #   .github  - an older copy of these workflows would replace itself
          #   *.zip    - stops an archive nested inside itself coming back
          tar -C "$SRC" \
            --exclude='./.git' --exclude='./.git/*' \
            --exclude='./.github' --exclude='./.github/*' \
            --exclude='./*.zip' \
            --exclude='./__MACOSX' --exclude='./__MACOSX/*' \
            -cf - . | tar -C "$GITHUB_WORKSPACE" -xf -

          rm -f "$ZIP"
          git rev-parse --git-dir >/dev/null

      - name: Stage and show what changed
        if: steps.guard.outputs.found == 'true'
        run: |
          set -euo pipefail
          git add -A
          git status --short | head -60
          echo "---"
          echo "Changed paths: $(git status --porcelain | wc -l)"

      - name: Commit and push
        if: steps.guard.outputs.found == 'true'
        run: |
          set -euo pipefail

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --cached --quiet; then
            echo "Nothing to commit - the archive matched the repo."
            exit 0
          fi

          git commit -m "Unzip archive"
          git push origin "HEAD:${GITHUB_REF_NAME}"
